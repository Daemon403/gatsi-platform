name: PostgreSQL backup
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    permissions: { contents: read }
    steps:
      - name: Create encrypted-format database dump
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: pg_dump "$DATABASE_URL" --format=custom --no-owner --no-privileges --file=gatsi-production.dump
      - uses: actions/upload-artifact@v4
        with:
          name: gatsi-production-${{ github.run_id }}
          path: gatsi-production.dump
          retention-days: 30
          if-no-files-found: error
