services:
  - type: web
    name: gatsi-api-staging
    runtime: node
    plan: starter
    branch: develop
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: staging
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: TOKEN_PEPPER_CURRENT
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: Promise
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: NOTIFICATION_WEBHOOK_URL
        sync: false
      - key: NOTIFICATION_WEBHOOK_SECRET_CURRENT
        generateValue: true
      - key: ERROR_WEBHOOK_URL
        sync: false
  - type: web
    name: gatsi-api-production
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm ci
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: TOKEN_PEPPER_CURRENT
        generateValue: true
      - key: INITIAL_ADMIN_USERNAME
        value: Promise
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: NOTIFICATION_WEBHOOK_URL
        sync: false
      - key: NOTIFICATION_WEBHOOK_SECRET_CURRENT
        generateValue: true
      - key: ERROR_WEBHOOK_URL
        sync: false
